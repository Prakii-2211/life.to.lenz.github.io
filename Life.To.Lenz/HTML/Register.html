<!DOCTYPE html>
<html>

<head>
<title>

</title>
<link rel="stylesheet" href="/CSS/Register.css">
</head>
<body>
    <div class="container">
        <p><strong>Enter the Details</strong></p>
        <form>
            <label>First Name</label>
            <input type="text" placeholder="Enter the First Name" required>

            <label>Last Name</label>
            <input type="text" placeholder="Enter the Last Name" required>

            <label>Email</label>
            <input type="email" placeholder="Enter the Email" required>

            <label>Mobile Number</label>
            <input type="number" placeholder="Enter the Mobile" required>

            <label>Password</label>
            <input type="password" placeholder="Enter the Password" required>

            <label>Confirm Password</label>
            <input type="password" placeholder="Again Enter the Password" required>

            <div class="button.container">
                <button type="submit"><a href="/HTML/LogIn.html">LogIn</a></button> 
                <button type="submit" onclick="alert"><a href="/HTML/Home.html">Register</a></button>
            </div>
        </form>
    </div>
 </body>



</html>
